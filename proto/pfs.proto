syntax = "proto3";

package pfs.v1;
option optimize_for = LITE_RUNTIME;

service Coordinator {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc AcquireToken(AcquireTokenRequest) returns (AcquireTokenResponse);
  rpc ReleaseToken(ReleaseTokenRequest) returns (Empty);
  rpc ReserveWrite(ReserveWriteRequest) returns (FileLayout);
  rpc CommitWrite(CommitWriteRequest) returns (Empty);
  rpc GetLayout(GetLayoutRequest) returns (FileLayout);
  rpc DeleteFile(DeleteFileRequest) returns (FileLayout);
  rpc ListFiles(Empty) returns (ListFilesResponse);
  rpc Health(Empty) returns (HealthResponse);
}

service Storage {
  rpc PutStripe(PutStripeRequest) returns (PutStripeResponse);
  rpc GetStripe(GetStripeRequest) returns (GetStripeResponse);
  rpc DeleteStripe(DeleteStripeRequest) returns (Empty);
  rpc Health(Empty) returns (HealthResponse);
}

message Empty {}
message HealthResponse { bool serving = 1; string component = 2; }
message Node { string id = 1; string address = 2; }
message Stripe { uint32 index = 1; string node_id = 2; string node_address = 3; uint64 size = 4; string checksum = 5; }
message FileLayout { string name = 1; uint64 size = 2; uint32 stripe_size = 3; uint64 version = 4; repeated Stripe stripes = 5; string write_id = 6; }
message RegisterNodeRequest { Node node = 1; }
message RegisterNodeResponse { uint32 node_count = 1; }

enum TokenMode { TOKEN_MODE_UNSPECIFIED = 0; TOKEN_MODE_READ = 1; TOKEN_MODE_WRITE = 2; }
message AcquireTokenRequest { string file = 1; string client_id = 2; TokenMode mode = 3; uint32 timeout_ms = 4; uint32 lease_ms = 5; }
message AcquireTokenResponse { string token = 1; uint64 expires_unix_ms = 2; }
message ReleaseTokenRequest { string file = 1; string token = 2; }

message ReserveWriteRequest { string name = 1; uint64 size = 2; uint32 stripe_size = 3; string token = 4; }
message CommitWriteRequest { FileLayout layout = 1; string token = 2; }
message GetLayoutRequest { string name = 1; string token = 2; }
message DeleteFileRequest { string name = 1; string token = 2; }
message FileInfo { string name = 1; uint64 size = 2; uint64 version = 3; uint32 stripe_count = 4; }
message ListFilesResponse { repeated FileInfo files = 1; }
message MetadataSnapshot { repeated FileLayout files = 1; }

message PutStripeRequest { string file = 1; uint64 version = 2; uint32 index = 3; bytes data = 4; }
message PutStripeResponse { string checksum = 1; uint64 size = 2; }
message GetStripeRequest { string file = 1; uint64 version = 2; uint32 index = 3; }
message GetStripeResponse { bytes data = 1; string checksum = 2; }
message DeleteStripeRequest { string file = 1; uint64 version = 2; uint32 index = 3; }
