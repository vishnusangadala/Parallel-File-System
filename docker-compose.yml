x-storage: &storage
  build: .
  entrypoint: ["pfs-storage"]
  depends_on: [coordinator]
  restart: unless-stopped
services:
  coordinator:
    build: .
    entrypoint: ["pfs-coordinator", "0.0.0.0:50051", "/metadata/metadata.pb"]
    ports: ["50051:50051"]
    volumes: ["metadata:/metadata"]
  storage1: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage1:50052", "storage1"], volumes: ["storage1:/data"]}
  storage2: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage2:50052", "storage2"], volumes: ["storage2:/data"]}
  storage3: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage3:50052", "storage3"], volumes: ["storage3:/data"]}
  storage4: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage4:50052", "storage4"], volumes: ["storage4:/data"]}
  storage5: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage5:50052", "storage5"], volumes: ["storage5:/data"]}
  storage6: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage6:50052", "storage6"], volumes: ["storage6:/data"]}
  storage7: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage7:50052", "storage7"], volumes: ["storage7:/data"]}
  storage8: {<<: *storage, command: ["0.0.0.0:50052", "/data", "coordinator:50051", "storage8:50052", "storage8"], volumes: ["storage8:/data"]}
  integration:
    build: .
    profiles: ["test"]
    entrypoint: ["integration_test", "coordinator:50051"]
    depends_on: [storage1, storage2, storage3, storage4, storage5, storage6, storage7, storage8]
  stress:
    build: .
    profiles: ["test"]
    entrypoint: ["stress_test", "coordinator:50051", "210", "216"]
    depends_on: [storage1, storage2, storage3, storage4, storage5, storage6, storage7, storage8]
volumes: {metadata: {}, storage1: {}, storage2: {}, storage3: {}, storage4: {}, storage5: {}, storage6: {}, storage7: {}, storage8: {}}
